name: egg_incubator
description: "Watch and control an ESP32 egg incubator from your phone."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
